---
x-superset-image: &superset-image apache/superset:4.1.1
x-postgres-image: &postgres-image postgres:16

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset-db-volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 60s
    restart: always
  # This automation container runs once on startup, sets everything up, and exits cleanly.
  superset-init:
    image: *superset-image
    environment:
      SUPERSET_SECRET_KEY: superset_dev_secret
      SUPERSET_CONFIG_PATH: /workspace/superset_config.py
      SUPERSET__SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@postgres:5432/superset
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command:
      - /bin/sh
      - -ec
      - |
        echo "Installing database drivers..."
        pip install --no-cache-dir "psycopg2-binary>=2.9"
        
        echo "Running database migrations..."
        superset db upgrade
        
        echo "Creating admin user..."
        superset fab create-admin \
          --username admin \
          --firstname Superset \
          --lastname Admin \
          --email admin@example.com \
          --password admin || true

        echo "Ensuring admin password is set..."
        superset fab reset-password \
          --username admin \
          --password admin
          
        echo "Initializing roles and permissions..."
        superset init

        echo "Loading CSV data into Postgres..."
        python main.py
        
        echo "Initialization complete!"
    restart: "no"

  superset:
    image: *superset-image
    environment:
      SUPERSET_SECRET_KEY: superset_dev_secret
      SUPERSET_CONFIG_PATH: /workspace/superset_config.py
      SUPERSET__SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@postgres:5432/superset
    ports:
      - "8088:8088"
    depends_on:
      # The web server will NOT start until the init container successfully finishes
      superset-init:
        condition: service_completed_successfully
    volumes:
      - ./:/workspace
    command:
      - /bin/sh
      - -ec
      - |
        pip install --no-cache-dir "psycopg2-binary>=2.9"
        superset run -h 0.0.0.0 -p 8088 --with-threads --reload
    restart: always

volumes:
  superset-db-volume: